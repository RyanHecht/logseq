# Builds the container images needed to self-host Logseq's DB version, and
# publishes them to GHCR so a compose stack can pull rather than build locally.
#
#   ghcr.io/<owner>/logseq-db-sync : self-hosted sync server (deps/db-sync)
#   ghcr.io/<owner>/logseq-agent   : Logseq CLI + db-worker-node + agent bridge
#
# Together with the existing logseq-webapp image (build-docker.yml), these cover
# a full self-hosted deployment: web frontend, sync server, and an always-on
# replica for running `logseq agent bridge`.
#
# Toolchain versions are intentionally kept in sync with deps-cli.yml.

name: Build-Selfhost-Images

on:
  workflow_dispatch:
    inputs:
      push:
        description: "Push images to GHCR (uncheck to build only)"
        type: boolean
        default: true
  push:
    branches: [selfhost-docker]
    paths:
      - 'selfhost/**'
      - '.github/workflows/build-selfhost-images.yml'
      - 'cli/**'
      - 'deps/db-sync/**'
      - 'src/main/logseq/cli/**'
      - 'src/main/frontend/worker/**'

env:
  CLOJURE_VERSION: '1.12.4.1618'
  JAVA_VERSION: '21'
  NODE_VERSION: '24'
  OCAML_VERSION: '5.4.0'

concurrency:
  group: selfhost-images-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── Sync server ────────────────────────────────────────────────────────────
  # Builds inside the Dockerfile on purpose: better-sqlite3 is a native module
  # and must compile against the runtime image it will actually run on.
  db-sync:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve lowercase image owner
        run: echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: ${{ inputs.push || github.event_name == 'push' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: selfhost/db-sync/Dockerfile
          # amd64 only: cross-building better-sqlite3 under QEMU is slow and
          # fragile. Add arm64 here if an arm host is ever needed.
          platforms: linux/amd64
          push: ${{ inputs.push || github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/logseq-db-sync:latest
            ghcr.io/${{ env.IMAGE_OWNER }}/logseq-db-sync:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Agent replica ──────────────────────────────────────────────────────────
  # Artifacts are built on the runner, which already has first-class OCaml and
  # Clojure setup actions, then copied into a slim runtime image. Build steps
  # mirror deps-cli.yml so they stay honest as the CLI evolves.
  agent:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - uses: DeLaGuardo/setup-clojure@13.5
        with:
          cli: ${{ env.CLOJURE_VERSION }}

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ env.OCAML_VERSION }}

      - name: Fetch OCaml deps
        working-directory: cli
        run: opam install . --deps-only --yes

      - name: Fetch pnpm deps
        run: pnpm install --frozen-lockfile

      # cli/ is not a pnpm workspace member, so the root install does not
      # populate cli/node_modules and `pnpm --dir cli bundle` cannot find vite.
      - name: Fetch CLI pnpm deps
        run: pnpm --dir cli install --frozen-lockfile --ignore-workspace

      - name: Build CLI and db-worker-node
        run: |
          opam exec -- pnpm cli:release
          pnpm db-worker-node:release:bundle

      - name: Verify artifacts exist
        run: |
          test -f static/logseq-cli.js   || { echo "missing static/logseq-cli.js"; exit 1; }
          test -f dist/db-worker-node.js || { echo "missing dist/db-worker-node.js"; exit 1; }
          ls -la dist/

      - name: Resolve lowercase image owner
        run: echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: ${{ inputs.push || github.event_name == 'push' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: selfhost/agent/Dockerfile
          platforms: linux/amd64
          push: ${{ inputs.push || github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/logseq-agent:latest
            ghcr.io/${{ env.IMAGE_OWNER }}/logseq-agent:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
