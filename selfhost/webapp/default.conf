# Logseq's web assets are NOT content-hashed: the app always loads /js/main.js
# under that fixed name. With a normal long max-age, a CDN or browser keeps
# serving the previous build for hours after a deploy, which looks exactly like
# a failed deployment (the app reports its old version number).
#
# Revalidate instead of guessing. `no-cache` still allows 304s via ETag, so this
# costs a conditional request rather than a full re-download.

server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Seed files are served from mounted config DIRECTORIES rather than being
    # bind-mounted as individual files into the web root.
    #
    # A missing bind-mount source makes Docker create a directory in its place.
    # Mounting that over a file path in a read-only container fails the
    # container outright, taking the whole web app down. Mounting directories
    # instead degrades gracefully: an absent file is simply a 404, which the
    # seed script already treats as "nothing to seed".
    location = /web-defaults.json {
        alias /config/defaults/web-defaults.json;
        add_header Cache-Control "no-cache" always;
    }

    location = /web-secrets.json {
        alias /config/secrets/web-secrets.json;
        add_header Cache-Control "no-cache" always;
    }

    # Entry points and un-fingerprinted bundles must always be revalidated.
    location ~* \.(html|js|css|json)$ {
        add_header Cache-Control "no-cache" always;
    }

    # Fonts and images are effectively immutable in practice and are large, so
    # they keep a normal cache lifetime.
    location ~* \.(woff2?|ttf|eot|png|jpe?g|gif|svg|ico|webp)$ {
        add_header Cache-Control "public, max-age=604800" always;
    }
}
