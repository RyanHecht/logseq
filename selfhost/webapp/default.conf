# Logseq's web assets are NOT content-hashed: the app always loads /js/main.js
# under that fixed name. With a normal long max-age, a CDN or browser keeps
# serving the previous build for hours after a deploy, which looks exactly like
# a failed deployment (the app reports its old version number).
#
# Revalidate instead of guessing. `no-cache` still allows 304s via ETag, so this
# costs a conditional request rather than a full re-download.

server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Seed files are assembled into /tmp/seed at startup by
    # /docker-entrypoint.d/20-seed-config.sh, from either an environment
    # variable or a mounted config directory.
    #
    # They are deliberately not bind-mounted as individual files into the web
    # root: Docker substitutes a directory for a missing bind source, and
    # mounting that over a file path in a read-only container stops the
    # container starting. An absent file here is simply a 404, which the seed
    # script treats as nothing to seed.
    location = /web-defaults.json {
        alias /tmp/seed/web-defaults.json;
        add_header Cache-Control "no-cache" always;
    }

    location = /web-secrets.json {
        alias /tmp/seed/web-secrets.json;
        add_header Cache-Control "no-cache" always;
    }

    # Entry points and un-fingerprinted bundles must always be revalidated.
    location ~* \.(html|js|css|json)$ {
        add_header Cache-Control "no-cache" always;
    }

    # Fonts and images are effectively immutable in practice and are large, so
    # they keep a normal cache lifetime.
    location ~* \.(woff2?|ttf|eot|png|jpe?g|gif|svg|ico|webp)$ {
        add_header Cache-Control "public, max-age=604800" always;
    }
}
